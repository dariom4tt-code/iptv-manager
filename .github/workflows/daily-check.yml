name: daily-check
on:
  schedule: [{cron: "17 5 * * *"}]   # una volta al giorno
  workflow_dispatch:
permissions:
  contents: write                     # solo per committare report/storico
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m unittest discover -s tests
      - run: python -m iptv_manager validate
      - run: python -m iptv_manager check
      - run: python -m iptv_manager epg
      - name: Commit report e storico
        run: |
          git config user.name "iptv-manager-bot"; git config user.email "bot@users.noreply.github.com"
          git add reports && (git diff --cached --quiet || git commit -m "report: controllo giornaliero") && git push
      # NOTA: questo workflow NON modifica mai il Gist. Eliminazioni/aggiunte/sostituzioni
      # restano proposte in reports/proposals.json da approvare manualmente.
